<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Shlutesaibo 工作台</title>
<style>
:root{--bg:#FBFBFA;--text:#1A1A19;--sub:#787774;--border:#E8E8E5;--card:#FFFFFF;--hover:#F5F5F3;--green:#16A34A;--red:#B91C1C;--amber:#92400E;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:860px;margin:0 auto;padding:24px 16px 48px}
/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap;gap:8px}
.header h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.subtitle{color:var(--sub);font-size:13px;margin-top:2px}
.date{font-size:13px;color:var(--sub);text-align:right}
.stats{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--sub);background:var(--card);padding:3px 10px;border-radius:4px;border:1px solid var(--border)}
/* Section */
.section{margin-bottom:36px}
.section-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-h h2{font-size:18px;font-weight:600;letter-spacing:-.3px}
.count{background:var(--text);color:var(--bg);font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
/* Task cards */
.task-list{display:flex;flex-direction:column;gap:14px}
.task{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:opacity .2s}
.task.done{opacity:.5}
.task-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:.3px}
.badge.p0{background:#FEE2E2;color:var(--red)}
.badge.p1{background:#FEF3C7;color:var(--amber)}
.task-title{font-size:16px;font-weight:600;flex:1}
.steps{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.8}
.steps ol{padding-left:18px}
.steps li{margin-bottom:2px}
/* Template block */
.tpl{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden}
.tpl-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--hover)}
.tpl-l{font-size:12px;color:var(--sub);font-weight:500}
.copy-btn{background:var(--text);color:var(--bg);border:none;padding:4px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s}
.copy-btn:hover{opacity:.85}
.copy-btn.ok{background:var(--green)}
.tpl-c{padding:10px 12px;font-size:13px;font-family:'SF Mono','Fira Code',Menlo,monospace;white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:300px;overflow-y:auto}
/* Attachment */
.attach{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:8px 0}
/* Task footer */
.task-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px}
.task-time{font-size:12px;color:var(--sub)}
.check{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;cursor:pointer;accent-color:var(--text)}
/* Feedback */
.fb{margin-top:10px;display:none}
.fb.show{display:block}
.fb textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:50px;background:var(--bg);color:var(--text)}
/* Client grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.cc-name{font-size:15px;font-weight:600;margin-bottom:6px}
.cc-row{font-size:12px;color:var(--sub);margin-bottom:3px}
.cc-status{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;margin-bottom:6px;font-weight:500}
.cc-status.due{background:#FEE2E2;color:var(--red)}
.cc-status.wait{background:#FEF3C7;color:var(--amber)}
.cc-status.new{background:#DBEAFE;color:#1E40AF}
/* Schedule table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{background:var(--hover);font-weight:600;font-size:12px;color:var(--sub)}
.tbl tr:last-child td{border-bottom:none}
.tbl .today{color:var(--red);font-weight:600}
/* Asset list */
.alist{display:flex;flex-direction:column;gap:10px}
.ac{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.ac-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ac-name{font-size:15px;font-weight:500}
.ac-desc{font-size:12px;color:var(--sub);margin-top:2px}
.ac-body{margin-top:10px;display:none}
.ac-body.open{display:block}
.ac-body .tpl-c{border:1px solid var(--border)}
/* Feedback export */
.fb-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.fb-info{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.6}
#fb-text{width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;font-family:'SF Mono',Menlo,monospace;resize:vertical;margin-bottom:10px;background:var(--bg);color:var(--text);line-height:1.5;min-height:160px}
.btn{background:var(--text);color:var(--bg);border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{opacity:.85}
.btn.ok{background:var(--green)}
/* Footer */
.footer{text-align:center;padding:20px 0;border-top:1px solid var(--border);margin-top:36px;color:var(--sub);font-size:12px}
/* Collapsible */
.collapsible-h{cursor:pointer;user-select:none}
.collapsible-h .arrow{display:inline-block;transition:transform .2s;font-size:12px;margin-left:4px}
.collapsible-h.open .arrow{transform:rotate(90deg)}
.collapsible-body{display:none}
.collapsible-body.open{display:block}
/* Responsive */
@media(max-width:640px){
.container{padding:16px 12px 32px}
.header{flex-direction:column;gap:4px}
.stats{margin-top:4px}
.cgrid{grid-template-columns:1fr}
.tpl-c{font-size:12px;max-height:250px}
.tbl{font-size:12px}
.tbl th,.tbl td{padding:6px 8px}
}
</style>
</head>
<body>
<div class="container">
<!-- Header -->
<header class="header">
<div>
<h1>Shlutesaibo</h1>
<p class="subtitle">助听器跨境运营工作台</p>
</div>
<div>
<p class="date" id="today-date">2026-09-10</p>
<div class="stats" id="stats"></div>
</div>
</header>

<!-- Today's Tasks -->
<section class="section">
<div class="section-h"><h2>今日任务</h2><span class="count" id="task-count">5</span></div>
<div class="task-list" id="task-list"></div>
</section>

<!-- Client Pipeline -->
<section class="section">
<div class="section-h"><h2>客户看板</h2></div>
<div class="cgrid" id="client-list"></div>
</section>

<!-- Follow-up Schedule -->
<section class="section">
<div class="section-h"><h2>跟进时间表</h2></div>
<table class="tbl" id="schedule-table"></table>
</section>

<!-- Asset Library -->
<section class="section">
<div class="section-h"><h2>素材库</h2></div>
<div class="alist" id="asset-list"></div>
</section>

<!-- Feedback Export -->
<section class="section">
<div class="section-h"><h2>反馈导出</h2></div>
<div class="fb-box">
<p class="fb-info"><b>方式一：</b>点击「生成状态报告」→ 复制文字 → 发给我。<br><b>方式二：</b>点击「发送给 AI」，自动唤起邮件客户端并预填报告内容。<br><b>方式三：</b>点击「复制分享链接」，把链接发给我（包含你当前的工作状态）。</p>
<textarea id="fb-text" readonly placeholder="点击下方按钮生成状态报告..."></textarea>
<button class="btn" id="export-btn" onclick="exportStatus()">生成状态报告</button>
<button class="btn" id="copy-fb-btn" style="margin-left:8px" onclick="copyFeedback()">复制报告</button>
<button class="btn" id="send-ai-btn" style="margin-left:8px;background:#2563EB" onclick="sendToAI()">发送给 AI</button>
<div style="margin-top:12px;display:none" id="share-box">
<p class="fb-info" style="margin-bottom:6px">或复制此链接（包含你的完成状态）：</p>
<input type="text" id="share-url" readonly style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-family:'SF Mono',Menlo,monospace;background:var(--bg);color:var(--text)" value="">
</div>
</div>
</section>

<footer class="footer">
<p>Shlutesaibo Technology | 助听器跨境运营 | AI + 一人公司</p>
</footer>
</div>

body:`Dear Dr. Schumaier and the Tweak Hearing Team,

I'm Jack Cheng, founder of Shenzhen Shlutesaibo Technology Co., Ltd., a hearing aid manufacturer operating our own factory in Shenzhen, China.

/* ===== STATE ===== */
function getState(){try{return JSON.parse(localStorage.getItem('shlute_wb')||'{}')}catch(e){return{}}}
function saveState(s){localStorage.setItem('shlute_wb',JSON.stringify(s))}

/* ===== UTILS ===== */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function copyText(text,btn){
navigator.clipboard.writeText(text).then(()=>{
if(btn){const o=btn.textContent;btn.textContent='已复制';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1800)}
}).catch(()=>{
// Fallback
const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
if(btn){const o=btn.textContent;btn.textContent='已复制';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1800)}
});
}

function downloadPDF(){
const a=document.createElement('a');a.href=PDF_DATA_URI;a.download='Product_Catalog_2026.pdf';document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function renderTasks(){
const st=getState();
const list=document.getElementById('task-list');
let doneCount=0;
list.innerHTML=TASKS.map(t=>{
const d=st[t.id]||{};
const isDone=d.done||false;
const fb=d.feedback||'';
if(isDone)doneCount++;
let html=`<div class="task ${isDone?'done':''}" id="${t.id}">
<div class="task-top">
<span class="badge ${t.priority.toLowerCase()}">${t.priority}</span>
<span class="task-title">${esc(t.title)}</span>
</div>
<div class="steps"><ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
// Recipient or URL
if(t.recipient){
html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">收件人</span><button class="copy-btn" onclick="copyText('${esc(t.recipient)}',this)">复制</button></div><div class="tpl-c">${esc(t.recipient)}</div></div>`;
}
if(t.url){
html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">表单地址</span><a href="${t.url}" target="_blank" class="copy-btn" style="text-decoration:none">打开网页</a></div><div class="tpl-c">${esc(t.url)}</div></div>`;
}
 // Subject
 if(t.type==='email'){
 html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">邮件主题</span><button class="copy-btn" onclick="copyText('${esc(t.subject)}',this)">复制</button></div><div class="tpl-c">${esc(t.subject)}</div></div>`;
 }else if(t.subject && t.subject!=='[LinkedIn动态模板见素材库]' && t.subject!=='[竞品监控记录]' && t.subject!=='[回复模板见素材库]'){
 html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">说明</span><button class="copy-btn" onclick="copyText('${esc(t.subject)}',this)">复制</button></div><div class="tpl-c">${esc(t.subject)}</div></div>`;
 }
 // Body
 if(t.type==='email'){
 html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">邮件正文</span><button class="copy-btn" onclick="copyText(document.getElementById('body-${t.id}').textContent,this)">复制全部</button></div><div class="tpl-c" id="body-${t.id}">${esc(t.body)}</div></div>`;
 }else{
 html+=`<div class="tpl"><div class="tpl-h"><span class="tpl-l">内容/指引</span><button class="copy-btn" onclick="copyText(document.getElementById('body-${t.id}').textContent,this)">复制全部</button></div><div class="tpl-c" id="body-${t.id}">${esc(t.body)}</div></div>`;
 }
// Attachment
if(t.attachment){
html+=`<div class="attach">附件：${esc(t.attachment)} <button class="copy-btn" style="margin-left:8px" onclick="downloadPDF()">下载 PDF</button></div>`;
}
// Time
html+=`<div class="task-foot"><span class="task-time">最佳发送时间：${esc(t.bestTime)}</span>
<label class="check"><input type="checkbox" ${isDone?'checked':''} onchange="toggleTask('${t.id}')"><span>已完成</span></label></div>`;
// Feedback
html+=`<div class="fb ${isDone?'show':''}"><textarea placeholder="完成后在此写反馈（客户有没有回复？有没有遇到问题？）" onblur="saveFeedback('${t.id}',this.value)">${esc(fb)}</textarea></div>`;
html+=`</div>`;
return html;
}).join('');
// Update stats
const total=TASKS.length;
document.getElementById('task-count').textContent=total;
document.getElementById('stats').innerHTML=`<span class="stat">${total} 项任务</span><span class="stat">${doneCount} 已完成</span><span class="stat">${total-doneCount} 待执行</span><span class="stat">2 封已发</span><span class="stat">0 回复</span>`;
}

function toggleTask(id){
const st=getState();
if(!st[id])st[id]={};
st[id].done=!st[id].done;
saveState(st);
renderTasks();
}

function saveFeedback(id,val){
const st=getState();
if(!st[id])st[id]={};
st[id].feedback=val;
saveState(st);
}
